<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Progression Idle — Editor de Level (Grid)</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --border:#2c313a; --text:#e6e8eb; --muted:#9aa3ad; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:2; }
  h1 { font-size:15px; margin:0 0 8px; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  label { color:var(--muted); font-size:12px; }
  input[type=text], input[type=number] { background:#0f1115; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-size:13px; }
  input[type=number] { width:70px; }
  button { background:#262b33; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 10px; cursor:pointer; font-size:13px; }
  button:hover { background:#313844; }
  button.active { outline:2px solid #4dabf7; }
  .palette { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .swatch { display:flex; align-items:center; gap:6px; padding:4px 8px; border-radius:6px; border:1px solid var(--border); background:#0f1115; cursor:pointer; font-size:12px; }
  .swatch .dot { width:14px; height:14px; border-radius:3px; border:1px solid rgba(255,255,255,.25); }
  .swatch.active { outline:2px solid #4dabf7; }
  main { padding:14px; display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  canvas { background:#0b0d10; border:1px solid var(--border); border-radius:8px; image-rendering:pixelated; cursor:crosshair; }
  .side { min-width:260px; }
  textarea { width:100%; height:220px; background:#0f1115; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px; font:12px/1.4 ui-monospace,Consolas,monospace; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  .status { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>🗺️ Editor de Level — Progression Idle</h1>
  <div class="row">
    <label>Nome <input type="text" id="name" value="Nivel 1-1" style="width:160px"></label>
    <label>Colunas <input type="number" id="cols" value="55" min="4" max="200"></label>
    <label>Linhas <input type="number" id="rows" value="21" min="4" max="200"></label>
    <label>Célula(px) <input type="number" id="cell" value="21" min="8" max="64"></label>
    <button id="resize">Aplicar tamanho</button>
    <button id="clear">Limpar</button>
    <button id="undo">↶ Desfazer</button>
    <button id="redo">↷ Refazer</button>
    <button id="export">⬇ Exportar JSON</button>
    <button id="copy">⧉ Copiar JSON</button>
    <label style="margin-left:6px">Importar <input type="file" id="import" accept=".json"></label>
  </div>
  <div class="row" style="margin-top:8px">
    <label>Ferramenta</label>
    <button class="tool active" data-tool="brush">🖌 Pincel</button>
    <button class="tool" data-tool="erase">🧽 Borracha</button>
    <button class="tool" data-tool="fill">🪣 Preencher</button>
    <button class="tool" data-tool="select">⬚ Selecionar</button>
    <button class="tool" data-tool="move">✋ Mover (W)</button>
    <button id="copySel">⧉ Copiar área</button>
    <button id="pasteSel">📥 Colar</button>
  </div>
  <div class="palette" id="palette"></div>
</header>

<main>
  <canvas id="cv"></canvas>
  <div class="side">
    <div class="status" id="status">—</div>
    <div class="hint">
      <b>Pincel:</b> clique/arraste pinta. <b>Borracha:</b> clique/arraste apaga (ou clique direito).
      <b>Segure Ctrl (ou Shift) pintando</b> = traço <b>horizontal</b> · <b>⬚ Selecionar</b> + <b>Ctrl+C / Ctrl+V</b> copia/cola área · <b>W</b> = mover · <b>ESC</b> = pincel · <b>Ctrl+Z</b> desfaz.
    </div>
    <p style="margin:12px 0 6px"><b>JSON do nível</b></p>
    <textarea id="json" readonly></textarea>
  </div>
</main>

<script>
// ---- Paleta: id, nome, cor, tipo ----
const PALETTE = [
  { id: 0, name: "Vazio",          color: "#0b0d10", kind: "empty" },
  { id: 1, name: "Plataforma",     color: "#9e9e9e", kind: "platform" },
  { id: 2, name: "Plataforma 1-vi",color: "#4dabf7", kind: "oneway" },
  { id: 3, name: "Parede/Sólido",  color: "#5c636a", kind: "solid" },
  { id: 4, name: "Portal Entrada", color: "#51cf66", kind: "portal_in" },
  { id: 5, name: "Portal Saída",   color: "#f783ac", kind: "portal_out" },
  { id: 6, name: "Spawn Jogador",  color: "#ffd43b", kind: "spawn" },
];

const state = { cols: 55, rows: 21, cell: 21, tool: "brush", current: 1 };
let grid = [];
let selection = null;   // {x0,y0,x1,y1}
let clipboard = null;   // {w,h,data}
let hover = { x: 0, y: 0 };
let moving = null;
const undoStack = [], redoStack = [];
const MAX_HISTORY = 200;
function snapshot() {
  undoStack.push(JSON.stringify({ cols: state.cols, rows: state.rows, grid }));
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(JSON.stringify({ cols: state.cols, rows: state.rows, grid }));
  const s = JSON.parse(undoStack.pop());
  state.cols = s.cols; state.rows = s.rows; grid = s.grid; draw(); refreshJSON();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(JSON.stringify({ cols: state.cols, rows: state.rows, grid }));
  const s = JSON.parse(redoStack.pop());
  state.cols = s.cols; state.rows = s.rows; grid = s.grid; draw(); refreshJSON();
}

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);

function emptyGrid(cols, rows) { return Array.from({length: rows}, () => new Array(cols).fill(0)); }
function defaultGrid(cols, rows) {
  const g = emptyGrid(cols, rows);
  if (rows > 0) for (let x = 0; x < cols; x++) g[rows - 1][x] = 1; // piso: última linha = Plataforma
  return g;
}

function normalize() {
  const g = emptyGrid(state.cols, state.rows);
  for (let y = 0; y < Math.min(state.rows, grid.length); y++)
    for (let x = 0; x < Math.min(state.cols, grid[y].length); x++)
      g[y][x] = grid[y][x] || 0;
  grid = g;
}

function buildPalette() {
  const el = $("palette");
  el.innerHTML = "";
  for (const p of PALETTE) {
    const b = document.createElement("div");
    b.className = "swatch" + (p.id === state.current ? " active" : "");
    b.dataset.id = p.id;
    b.innerHTML = `<span class="dot" style="background:${p.color}"></span>${p.id} · ${p.name}`;
    b.onclick = () => { state.current = p.id; buildPalette(); };
    el.appendChild(b);
  }
}

function paintCell(x, y, id) {
  if (x < 0 || y < 0 || x >= state.cols || y >= state.rows) return;
  grid[y][x] = id;
  draw();
}

function fill(x, y, id) {
  const target = grid[y][x];
  if (target === id) return;
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cy < 0 || cx >= state.cols || cy >= state.rows) continue;
    if (grid[cy][cx] !== target) continue;
    grid[cy][cx] = id;
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  draw();
}

function draw() {
  cv.width = state.cols * state.cell;
  cv.height = state.rows * state.cell;
  for (let y = 0; y < state.rows; y++)
    for (let x = 0; x < state.cols; x++) {
      const id = grid[y][x] || 0;
      const p = PALETTE.find(p => p.id === id) || PALETTE[0];
      ctx.fillStyle = p.color;
      ctx.fillRect(x*state.cell, y*state.cell, state.cell, state.cell);
    }
  // grade (linhas a cada 5 mais visíveis)
  ctx.lineWidth = 1;
  for (let x = 0; x <= state.cols; x++) {
    ctx.strokeStyle = (x % 5 === 0) ? "rgba(255,255,255,0.34)" : "rgba(255,255,255,0.16)";
    ctx.beginPath(); ctx.moveTo(x*state.cell+0.5, 0); ctx.lineTo(x*state.cell+0.5, cv.height); ctx.stroke();
  }
  for (let y = 0; y <= state.rows; y++) {
    ctx.strokeStyle = (y % 5 === 0) ? "rgba(255,255,255,0.34)" : "rgba(255,255,255,0.16)";
    ctx.beginPath(); ctx.moveTo(0, y*state.cell+0.5); ctx.lineTo(cv.width, y*state.cell+0.5); ctx.stroke();
  }
  // seleção / preview de movimento
  if (moving) {
    for (let y = 0; y < moving.h; y++)
      for (let x = 0; x < moving.w; x++) {
        const id = moving.content[y][x]; if (!id) continue;
        const p = PALETTE.find(q => q.id === id) || PALETTE[0];
        ctx.fillStyle = p.color;
        ctx.fillRect((moving.x+x)*state.cell, (moving.y+y)*state.cell, state.cell, state.cell);
      }
    ctx.strokeStyle = "#ffd43b"; ctx.lineWidth = 2;
    ctx.strokeRect(moving.x*state.cell+1, moving.y*state.cell+1, moving.w*state.cell-2, moving.h*state.cell-2);
  } else if (selection) {
    const r = normRect(selection);
    ctx.fillStyle = "rgba(77,171,247,0.18)";
    ctx.fillRect(r.x0*state.cell, r.y0*state.cell, (r.x1-r.x0+1)*state.cell, (r.y1-r.y0+1)*state.cell);
    ctx.strokeStyle = "#4dabf7"; ctx.lineWidth = 2;
    ctx.strokeRect(r.x0*state.cell+1, r.y0*state.cell+1, (r.x1-r.x0+1)*state.cell-2, (r.y1-r.y0+1)*state.cell-2);
  }
}

let painting = false, eraseMode = false, strokeStart = null, lastPaint = null, selStart = null;
function pos(e) {
  const r = cv.getBoundingClientRect();
  return { x: Math.floor((e.clientX - r.left) / state.cell), y: Math.floor((e.clientY - r.top) / state.cell) };
}
function normRect(r) { return { x0: Math.min(r.x0, r.x1), y0: Math.min(r.y0, r.y1), x1: Math.max(r.x0, r.x1), y1: Math.max(r.y0, r.y1) }; }
function cellBrush() { return (eraseMode || state.tool === "erase") ? 0 : state.current; }
function setCell(x, y, id) { if (x < 0 || y < 0 || x >= state.cols || y >= state.rows) return; grid[y][x] = id; }
function apply(e) {
  const { x, y } = pos(e);
  const id = cellBrush();
  if (state.tool === "fill") { fill(x, y, id); lastPaint = { x, y }; return; }
  const horiz = e.ctrlKey || e.metaKey || e.shiftKey; // segura Ctrl (ou Shift) = traço horizontal
  if (horiz && strokeStart) {
    const row = strokeStart.y;
    const from = Math.min(lastPaint.x, x), to = Math.max(lastPaint.x, x);
    for (let cx = from; cx <= to; cx++) setCell(cx, row, id);
    lastPaint = { x, y: row };
  } else {
    setCell(x, y, id);
    lastPaint = { x, y };
  }
  draw();
}
cv.addEventListener("mousedown", (e) => {
  e.preventDefault();
  const p = pos(e); hover = p;
  if (state.tool === "select") { selStart = p; selection = { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; draw(); return; }
  if (state.tool === "move") {
    if (!selection) { $("status").textContent = "Crie uma seleção (⬚ Selecionar) antes de mover."; return; }
    const r = normRect(selection);
    if (p.x < r.x0 || p.x > r.x1 || p.y < r.y0 || p.y > r.y1) { $("status").textContent = "Clique DENTRO da seleção para mover."; return; }
    snapshot();
    const w = r.x1 - r.x0 + 1, h = r.y1 - r.y0 + 1, content = [];
    for (let y = r.y0; y <= r.y1; y++) { content.push(grid[y].slice(r.x0, r.x1+1)); for (let x = r.x0; x <= r.x1; x++) grid[y][x] = 0; }
    moving = { content, w, h, offsetX: p.x - r.x0, offsetY: p.y - r.y0, x: r.x0, y: r.y0 };
    draw(); return;
  }
  painting = true; eraseMode = e.button === 2; strokeStart = p; lastPaint = p; snapshot(); apply(e);
});
cv.addEventListener("mousemove", (e) => {
  const p = pos(e); hover = p;
  const h = e.ctrlKey || e.metaKey || e.shiftKey;
  $("status").textContent = `x:${p.x}  y:${p.y}  ·  id:${grid[p.y]?.[p.x] ?? "-"}` + (h ? "   ·   ⬅⬌➡ HORIZONTAL" : "");
  if (selStart) { selection = { x0: selStart.x, y0: selStart.y, x1: p.x, y1: p.y }; draw(); return; }
  if (moving) { moving.x = p.x - moving.offsetX; moving.y = p.y - moving.offsetY; draw(); return; }
  if (painting) apply(e);
});
window.addEventListener("mouseup", () => {
  if (selStart) { selection = normRect(selection); selStart = null; draw(); }
  if (moving) {
    for (let y = 0; y < moving.h; y++) for (let x = 0; x < moving.w; x++) setCell(moving.x + x, moving.y + y, moving.content[y][x]);
    selection = { x0: moving.x, y0: moving.y, x1: moving.x + moving.w - 1, y1: moving.y + moving.h - 1 };
    moving = null; draw(); refreshJSON();
  }
  painting = false; strokeStart = null; lastPaint = null;
});
cv.addEventListener("contextmenu", (e) => e.preventDefault());

function copySelection() {
  if (!selection) { $("status").textContent = "Selecione uma área primeiro (ferramenta ⬚ Selecionar)."; return; }
  const r = normRect(selection);
  const data = [];
  for (let y = r.y0; y <= r.y1; y++) data.push(grid[y].slice(r.x0, r.x1 + 1));
  clipboard = { w: r.x1 - r.x0 + 1, h: r.y1 - r.y0 + 1, data };
  $("status").textContent = `Copiado ${clipboard.w}×${clipboard.h}.`;
}
function pasteClipboard() {
  if (!clipboard) { $("status").textContent = "Nada para colar."; return; }
  snapshot();
  const ax = hover.x, ay = hover.y;
  for (let y = 0; y < clipboard.h; y++)
    for (let x = 0; x < clipboard.w; x++)
      setCell(ax + x, ay + y, clipboard.data[y][x]);
  selection = { x0: ax, y0: ay, x1: ax + clipboard.w - 1, y1: ay + clipboard.h - 1 };
  draw(); refreshJSON();
  $("status").textContent = `Colado ${clipboard.w}×${clipboard.h} em (${ax},${ay}).`;
}

function toJSON() {
  return {
    name: $("name").value,
    cols: grid[0]?.length ?? 0, rows: grid.length, cellSize: state.cell,
    legend: Object.fromEntries(PALETTE.map(p => [p.id, p.name])),
    grid: grid
  };
}
function refreshJSON() { $("json").value = JSON.stringify(toJSON(), null, 2); }
["input","change"].forEach(ev => document.addEventListener(ev, refreshJSON));

function clampInt(v, min, max, def) { v = parseInt(v, 10); if (isNaN(v)) v = def; return Math.max(min, Math.min(max, v)); }
function applySize(record = true) {
  const nc = clampInt($("cols").value, 4, 200, state.cols);
  const nr = clampInt($("rows").value, 4, 200, state.rows);
  const ncell = clampInt($("cell").value, 8, 64, state.cell);
  $("cols").value = nc; $("rows").value = nr; $("cell").value = ncell;
  if (nc === state.cols && nr === state.rows && ncell === state.cell) { draw(); return; }
  if (record) snapshot();
  state.cols = nc; state.rows = nr; state.cell = ncell;
  normalize(); draw(); refreshJSON();
}
$("resize").onclick = () => applySize(true);
let sizeTimer = null;
["cols","rows","cell"].forEach(id => {
  const el = $(id);
  el.addEventListener("input", () => { clearTimeout(sizeTimer); sizeTimer = setTimeout(() => applySize(false), 250); });
  el.addEventListener("change", () => applySize(true));
});
$("clear").onclick = () => { snapshot(); grid = defaultGrid(state.cols, state.rows); draw(); refreshJSON(); };
$("export").onclick = () => {
  const blob = new Blob([JSON.stringify(toJSON(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = ($("name").value || "level").replace(/\s+/g, "_") + ".json";
  a.click();
};
$("copy").onclick = async () => { await navigator.clipboard.writeText(JSON.stringify(toJSON())); $("copy").textContent = "✓"; setTimeout(()=>$("copy").textContent="⧉ Copiar JSON", 900); };
$("import").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { snapshot(); const d = JSON.parse(r.result); $("name").value = d.name || ""; state.cols = d.cols; state.rows = d.rows; state.cell = d.cellSize || 24; grid = d.grid; normalize(); draw(); refreshJSON(); };
  r.readAsText(f);
};
function setTool(name) {
  state.tool = name;
  document.querySelectorAll(".tool").forEach(x => x.classList.toggle("active", x.dataset.tool === name));
}
document.querySelectorAll(".tool").forEach(b => b.onclick = () => setTool(b.dataset.tool));
$("undo").onclick = undo;
$("redo").onclick = redo;
$("copySel").onclick = copySelection;
$("pasteSel").onclick = pasteClipboard;
document.addEventListener("keydown", (e) => {
  const ctrl = e.ctrlKey || e.metaKey;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return; // deixa copiar/colar normal nos campos
  if (ctrl && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (ctrl && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
  else if (ctrl && e.key.toLowerCase() === "c") { e.preventDefault(); copySelection(); }
  else if (ctrl && e.key.toLowerCase() === "v") { e.preventDefault(); pasteClipboard(); }
  else if (e.key.toLowerCase() === "w") { e.preventDefault(); setTool("move"); }
  else if (e.key === "Escape") { e.preventDefault(); setTool("brush"); }
});
cv.addEventListener("mouseleave", () => $("status").textContent = "—");

grid = defaultGrid(state.cols, state.rows);
buildPalette(); draw(); refreshJSON();
</script>
</body>
</html>
